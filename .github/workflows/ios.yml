name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: SirajCore Unit & Parity Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SirajCore tests
        run: swift test --package-path Packages/SirajCore

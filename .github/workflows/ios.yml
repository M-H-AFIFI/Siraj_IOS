name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test SirajCore & Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SirajCore tests
        run: swift test --package-path Packages/SirajCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build Siraj for iOS Simulator
        run: |
          xcodebuild build \
            -project Siraj.xcodeproj \
            -scheme Siraj \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build SirajSideload for iOS Device (unsigned)
        run: |
          xcodebuild build \
            -project Siraj.xcodeproj \
            -scheme SirajSideload \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

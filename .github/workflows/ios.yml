name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test, Screenshots & Unsigned IPAs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SirajCore tests
        run: swift test --package-path Packages/SirajCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select iPhone Simulator
        id: sim
        run: |
          SIM_ID=$(python3 -c '
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((runtime, d["name"], d["udid"]))
          preferred = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          for want in preferred:
              for _, name, udid in sorted(candidates, reverse=True):
                  if name == want:
                      print(udid)
                      raise SystemExit(0)
          print(sorted(candidates, reverse=True)[0][2])
          ')
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using Simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4 || true

      - name: Run Simulator UI screenshot suite
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project Siraj.xcodeproj \
            -scheme Siraj \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract Simulator screenshots
        run: python3 .github/scripts/extract_screenshots.py TestResults.xcresult artifacts/screenshots

      - name: Upload Simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error

      - name: Build unsigned Siraj-Sideload.ipa
        run: |
          xcodebuild build \
            -project Siraj.xcodeproj \
            -scheme SirajSideload \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/sideload \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p artifacts/ipa build/sideload/Payload
          cp -R build/sideload/Build/Products/Release-iphoneos/Siraj.app build/sideload/Payload/
          (cd build/sideload && zip -qr ../../artifacts/ipa/Siraj-Sideload.ipa Payload)

      - name: Build unsigned Siraj-Full.ipa
        run: |
          xcodebuild build \
            -project Siraj.xcodeproj \
            -scheme Siraj \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/full \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p artifacts/ipa build/full/Payload
          cp -R build/full/Build/Products/Release-iphoneos/Siraj.app build/full/Payload/
          (cd build/full && zip -qr ../../artifacts/ipa/Siraj-Full.ipa Payload)
          ls -lh artifacts/ipa/

      - name: Upload unsigned IPA builds
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-builds
          path: artifacts/ipa/*.ipa
          if-no-files-found: error

  testflight:
    name: Archive & Upload to TestFlight
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && vars.ENABLE_TESTFLIGHT == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Archive signed IPA
        run: |
          echo "Configure Apple signing secrets (APPLE_CERT_P12, APP_STORE_CONNECT_API_KEY) to enable TestFlight upload."
          exit 1

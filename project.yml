name: Siraj
options:
  bundleIdPrefix: com.siiraj
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  SirajCore:
    path: Packages/SirajCore

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP_ID: group.com.siiraj.app
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Siraj:
    type: application
    platform: iOS
    sources:
      - path: SirajApp
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siiraj.app
        INFOPLIST_FILE: SirajApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: SirajApp/Siraj.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SirajCore

  SirajSideload:
    type: application
    platform: iOS
    sources:
      - path: SirajApp
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Siraj
        PRODUCT_BUNDLE_IDENTIFIER: com.siiraj.app
        INFOPLIST_FILE: SirajApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: SirajApp/SirajSideload.entitlements
        APP_GROUP_ID: ""
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SirajCore

schemes:
  Siraj:
    build:
      targets:
        Siraj: all
  SirajSideload:
    build:
      targets:
        SirajSideload: all
